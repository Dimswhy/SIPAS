<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Dashboard Arsip</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

</head>

<body class="bg-gray-100 flex">

<!-- SIDEBAR -->
<div class="w-64 bg-slate-800 text-white min-h-screen p-4">
  <h2 class="text-xl font-bold mb-6">📁 E-Arsip</h2>

  <ul class="space-y-2 text-sm">
    <li onclick="goDashboard()" class="bg-blue-500 p-2 rounded cursor-pointer">Dashboard</li>

    <li>
      <div onclick="toggleDropdown()" class="hover:bg-slate-700 p-2 rounded flex justify-between cursor-pointer">
        Dokumen <span id="iconDropdown">▼</span>
      </div>

      <ul id="dropdownDokumen" class="ml-3 mt-1 hidden text-xs space-y-1">
        <li onclick="filterDokumen('')" class="hover:bg-slate-700 p-2 rounded">Semua</li>
        <li onclick="filterDokumen('masuk')" class="hover:bg-slate-700 p-2 rounded">Surat Masuk</li>
        <li onclick="filterDokumen('keluar')" class="hover:bg-slate-700 p-2 rounded">Surat Keluar</li>
        <li onclick="filterDokumen('keputusan')" class="hover:bg-slate-700 p-2 rounded">Surat Keputusan</li>
      </ul>
    </li>
  </ul>
</div>

<!-- MAIN -->
<div class="flex-1 p-6">

  <!-- HEADER -->
  <div class="flex justify-between mb-6">
    <h1 class="text-xl font-semibold">Dashboard</h1>
    <div class="bg-white px-4 py-2 rounded shadow text-sm">Admin</div>
  </div>

  <!-- CARD -->
  <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
    <div class="bg-blue-500 text-white p-4 rounded shadow">
      <p id="totalArsip" class="text-lg font-bold">0</p>
      <p>Total Dokumen</p>
    </div>

    <div class="bg-green-500 text-white p-4 rounded shadow">
      <p>-</p><p>Total Size</p>
    </div>

    <div class="bg-orange-500 text-white p-4 rounded shadow">
      <p>3</p><p>Total Kategori</p>
    </div>

    <div class="bg-red-500 text-white p-4 rounded shadow">
      <p class="font-bold">Tambah Arsip</p>
      <p class="text-sm">Upload dokumen</p>
    </div>
  </div>

  <!-- CONTENT -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

    <!-- TABLE -->
    <div class="md:col-span-2 bg-white p-4 rounded shadow">

      <h2 id="judulDokumen" class="font-semibold mb-3">Dokumen</h2>

      <form id="formDokumen" class="flex gap-2 mb-3 text-sm flex-wrap">
        <input id="nama" placeholder="Nama" class="border p-1 rounded">
        <input id="jenis" placeholder="Jenis" class="border p-1 rounded">
        <input id="fileDokumen" type="file" class="border p-1 rounded">
        <button class="bg-blue-500 text-white px-3 rounded">Simpan</button>
      </form>

      <div class="flex justify-between mb-3">
        <select id="filterJenis" class="border p-1 rounded text-sm">
          <option value="">Semua</option>
          <option value="masuk">Surat Masuk</option>
          <option value="keluar">Surat Keluar</option>
          <option value="keputusan">Surat Keputusan</option>
        </select>

        <input id="searchInput" placeholder="Search..." class="border p-1 rounded text-sm">
      </div>

      <table class="w-full text-sm">
        <thead class="bg-gray-100">
          <tr>
            <th class="p-2">No</th>
            <th class="p-2">Nama</th>
            <th class="p-2">Jenis</th>
            <th class="p-2">File</th>
            <th class="p-2">Aksi</th>
          </tr>
        </thead>
        <tbody id="dataDokumen"></tbody>
      </table>
    </div>

    <!-- CHART -->
    <div class="bg-white p-4 rounded shadow">
      <h2 class="font-semibold mb-3">Kategori</h2>
      <canvas id="chartKategori"></canvas>
    </div>

  </div>
</div>

<script>

/* FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "ISI_API_KEY",
  authDomain: "ISI_PROJECT.firebaseapp.com",
  databaseURL: "https://ISI_PROJECT-default-rtdb.firebaseio.com",
  projectId: "ISI_PROJECT"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let data = [];
let chart;

/* REALTIME LISTENER */
db.ref("arsip").on("value", (snap)=>{
  let val = snap.val();
  data = val ? Object.entries(val) : [];
  render();
});

/* DROPDOWN */
function toggleDropdown(){
  dropdownDokumen.classList.toggle("hidden");
  iconDropdown.innerText = iconDropdown.innerText==="▼"?"▲":"▼";
}

/* FILTER */
function filterDokumen(jenis){
  filterJenis.value = jenis;
  judulDokumen.scrollIntoView({behavior:"smooth"});
  render();
}

/* NAV */
function goDashboard(){
  window.scrollTo({top:0,behavior:"smooth"});
}

/* RENDER */
function render(){
  let tbody = dataDokumen;
  tbody.innerHTML = "";

  let keyword = searchInput.value.toLowerCase();
  let filter = filterJenis.value;

  let kategori = {Masuk:0,Keluar:0,SK:0};

  data.forEach(([key,d],i)=>{
    let jenis = (d.jenis||"").toLowerCase();
    let nama = (d.nama||"").toLowerCase();

    if(!(nama.includes(keyword)||jenis.includes(keyword))) return;
    if(filter && !jenis.includes(filter)) return;

    if(jenis.includes("masuk")) kategori.Masuk++;
    else if(jenis.includes("keluar")) kategori.Keluar++;
    else kategori.SK++;

    tbody.innerHTML += `
    <tr class="border-t text-center">
      <td class="p-2">${i+1}</td>
      <td class="p-2">${d.nama}</td>
      <td class="p-2">${d.jenis}</td>
      <td class="p-2">
        ${d.file ? `<button onclick="lihatFile('${d.file}')" class="bg-blue-500 text-white px-2 py-1 rounded text-xs">Lihat</button>` : "-"}
      </td>
      <td class="p-2">
        <button onclick="hapus('${key}')" class="bg-red-500 text-white px-2 py-1 rounded text-xs">Hapus</button>
      </td>
    </tr>`;
  });

  totalArsip.innerText = data.length;
  updateChart(kategori);
}

/* CHART */
function updateChart(k){
  if(chart) chart.destroy();
  chart = new Chart(chartKategori,{
    type:"doughnut",
    data:{labels:["Masuk","Keluar","SK"],datasets:[{data:[k.Masuk,k.Keluar,k.SK]}]},
    options:{plugins:{legend:{position:"bottom"}}}
  });
}

/* TAMBAH DATA */
formDokumen.onsubmit = function(e){
  e.preventDefault();

  let fileInput = fileDokumen;

  if(fileInput.files.length > 0){
    let reader = new FileReader();

    reader.onload = function(e){
      db.ref("arsip").push({
        nama:nama.value,
        jenis:jenis.value,
        file:e.target.result
      });
      formDokumen.reset();
    };

    reader.readAsDataURL(fileInput.files[0]);
    return;
  }

  db.ref("arsip").push({
    nama:nama.value,
    jenis:jenis.value,
    file:""
  });

  formDokumen.reset();
};

/* HAPUS */
function hapus(key){
  db.ref("arsip/"+key).remove();
}

/* LIHAT FILE */
function lihatFile(file){
  window.open(file,"_blank");
}

/* EVENT */
searchInput.addEventListener("keyup",render);
filterJenis.addEventListener("change",render);

</script>

</body>
</html>
